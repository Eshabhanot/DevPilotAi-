spring:
   application:
      name: auth-service

   datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/devpilot_auth}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:esha123}

   jpa:
    hibernate:
      ddl-auto: update			
    show-sql: false			
server:
   port: 8081

eureka:
   client:
     service-url:
        defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

     instance:
        prefer-ip-address: true

app:
   jwt:
      secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItbXktbWljcm9zZXJ2aWNlcy1hcHAtMjAyNg==}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      cleanup-cron: ${JWT_CLEANUP_CRON:0 0 * * * *}
